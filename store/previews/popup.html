<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifras Scroll — demonstração do controle</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #f8f7f1; color: #223129; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .browser { min-height: 800px; padding: 78px 510px 90px 100px; background: linear-gradient(135deg, #f8f7f1 0%, #f3f1e9 62%, #e7eee8 100%); }
      .eyebrow { margin: 0 0 14px; color: #28724e; font-size: 14px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 620px; margin: 0; font-family: Georgia, serif; font-size: 58px; line-height: 1.02; letter-spacing: -.045em; }
      .lead { max-width: 620px; margin: 24px 0 38px; color: #657068; font-size: 19px; line-height: 1.6; }
      .line { height: 13px; margin: 17px 0; border-radius: 99px; background: #d9ddd7; }
      .line:nth-child(2n) { width: 88%; }
      .line:nth-child(3n) { width: 73%; }
      .popup-frame { position: absolute; top: 55px; right: 92px; width: 362px; height: 690px; overflow: hidden; border: 1px solid #c9cec8; border-radius: 18px; background: #f3f1e9; box-shadow: 0 28px 70px rgba(29, 54, 40, .2); }
      iframe { width: 360px; height: 690px; border: 0; }
      .badge { position: absolute; top: 30px; right: 74px; display: grid; place-items: center; min-width: 38px; height: 25px; padding: 0 8px; border-radius: 8px; background: #18794e; color: white; font-size: 13px; font-weight: 900; box-shadow: 0 4px 12px rgba(24, 121, 78, .24); }
    </style>
  </head>
  <body>
    <main class="browser">
      <p class="eyebrow">Leitura sem interrupções</p>
      <h1>Continue na página enquanto suas mãos ficam livres.</h1>
      <p class="lead">O popup informa claramente quando a câmera está ligada e oferece parada imediata pela interface ou teclado.</p>
      <div aria-hidden="true">
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      </div>
      <span class="badge">ON</span>
      <div class="popup-frame"><iframe src="popup-card.html" title="Popup do Cifras Scroll"></iframe></div>
    </main>
  </body>
</html>
